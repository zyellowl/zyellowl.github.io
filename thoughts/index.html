<h1>想法</h1><h2>插话之后，模型该记住哪一段</h2><p>一轮回复生成完的时候，用户可能只听了前半段。下一轮应该保留用户实际收到的范围。客户端在打断时回报播放进度，服务端在下一轮上下文里标出已播范围。</p><h2>工具该返回多少数据</h2><p>工具返回什么，取决于下一步分析需要什么。确认执行结果时，只回状态和条数，避免把整批明细再次送进模型。</p><h2>如何判断一次修复有效</h2><p>把线上问题还原到当时的执行记录，才能在沙箱里复现并检查改动。大保从生产 Trace 发现问题，改动通过验证和评测后合并，发布后再看新的 Trace。</p></main>

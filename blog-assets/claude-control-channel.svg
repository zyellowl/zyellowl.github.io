<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Claude Agent SDK 的公开进程边界</title>
  <desc id="desc">宿主、公开 Python wrapper 与私有 CLI 三层通过标准输入输出交换数据和控制消息；transcript mirror 是尽力而为的恢复副本。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#667085"/></marker></defs>
  <rect width="1200" height="640" rx="36" fill="#f8f7fb"/>
  <text x="64" y="74" fill="#101828" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="650">Public boundary, not a private-core diagram</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="64" y="142" width="292" height="310" rx="26" fill="#effaf4" stroke="#6bc391" stroke-width="2"/>
    <text x="94" y="188" fill="#287a4d" font-size="14">HOST APPLICATION</text><text x="94" y="226" fill="#101828" font-size="23" font-weight="650">Client + policy</text>
    <text x="94" y="272" fill="#475467" font-size="16">permission callback</text><text x="94" y="305" fill="#475467" font-size="16">hooks · SDK MCP</text><text x="94" y="338" fill="#475467" font-size="16">SessionStore</text>
    <rect x="454" y="142" width="292" height="310" rx="26" fill="#f1efff" stroke="#9487e8" stroke-width="2"/>
    <text x="484" y="188" fill="#6554c0" font-size="14">MIT WRAPPER @ 542fefb</text><text x="484" y="226" fill="#101828" font-size="23" font-weight="650">Query + Transport</text>
    <text x="484" y="272" fill="#475467" font-size="16">stream-json router</text><text x="484" y="305" fill="#475467" font-size="16">control request handler</text><text x="484" y="338" fill="#475467" font-size="16">limited task ledger</text>
    <rect x="844" y="142" width="292" height="310" rx="26" fill="#fff7f4" stroke="#dd8b72" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="874" y="188" fill="#b5472b" font-size="14">PROPRIETARY / OPAQUE</text><text x="874" y="226" fill="#101828" font-size="23" font-weight="650">Bundled CLI</text>
    <text x="874" y="272" fill="#475467" font-size="16">不能由 wrapper 反推</text><text x="874" y="305" fill="#475467" font-size="16">内部规划与调度结构</text>
  </g>
  <g stroke="#667085" stroke-width="2.2" fill="none" marker-end="url(#a)"><path d="M356 238h88"/><path d="M746 238h88"/><path d="M844 358h-88"/><path d="M454 358h-88"/></g>
  <text x="377" y="222" fill="#667085" font-family="sans-serif" font-size="13">callbacks</text><text x="766" y="222" fill="#667085" font-family="sans-serif" font-size="13">stdin</text><text x="774" y="389" fill="#667085" font-family="sans-serif" font-size="13">stdout</text>
  <rect x="454" y="504" width="292" height="78" rx="18" fill="#fff" stroke="#d0d5dd"/>
  <text x="480" y="536" fill="#344054" font-family="sans-serif" font-size="14">TRANSCRIPT MIRROR</text><text x="480" y="562" fill="#101828" font-family="sans-serif" font-size="16" font-weight="600">best effort · bounded retry</text>
  <path d="M600 452v42" stroke="#667085" stroke-width="2.2" marker-end="url(#a)"/>
</svg>

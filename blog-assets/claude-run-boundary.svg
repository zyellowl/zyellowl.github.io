<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Claude Agent SDK 中 Result、任务台账与运行边界</title>
  <desc id="desc">ResultMessage 只是输出事件，不单独定义整个运行结束；公开 wrapper 的 local agent 与 local workflow 有限台账用于推迟过早关闭，标准输入关闭才进入传输清理。Transcript mirror 对普通异常有限重试、对超时不重试，是恢复缓解措施，不是运行边界。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#667085"/></marker></defs>
  <rect width="1200" height="680" rx="36" fill="#f8f7fb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="66" y="72" fill="#101828" font-size="28" font-weight="650">A result event is not, by itself, a run boundary</text>
    <text x="66" y="106" fill="#667085" font-size="17">公开 wrapper 只能证明它如何路由消息、跟踪本地任务与清理传输。</text>

    <text x="66" y="158" fill="#667085" font-size="14">STDOUT ROUTER</text>
    <rect x="66" y="180" width="236" height="130" rx="22" fill="#fff" stroke="#d0d5dd" stroke-width="2"/>
    <text x="94" y="220" fill="#344054" font-size="14">OUTPUT EVENT</text>
    <text x="94" y="258" fill="#101828" font-size="22" font-weight="650">ResultMessage</text>
    <text x="94" y="286" fill="#475467" font-size="14">yield to caller</text>

    <rect x="376" y="164" width="312" height="162" rx="24" fill="#f1efff" stroke="#9487e8" stroke-width="2"/>
    <text x="406" y="204" fill="#6554c0" font-size="14">FINITE LOCAL TASK LEDGER</text>
    <text x="406" y="244" fill="#101828" font-size="20" font-weight="650">local_agent · local_workflow</text>
    <text x="406" y="278" fill="#475467" font-size="15">仍有被 wrapper 跟踪的本地任务？</text>
    <text x="406" y="304" fill="#475467" font-size="15">有 → 推迟 early stdin close</text>

    <rect x="762" y="180" width="370" height="130" rx="22" fill="#edf8f3" stroke="#84c9aa" stroke-width="2"/>
    <text x="792" y="220" fill="#287a5e" font-size="14">TRANSPORT LIFECYCLE</text>
    <text x="792" y="258" fill="#101828" font-size="22" font-weight="650">close stdin → cleanup</text>
    <text x="792" y="286" fill="#475467" font-size="14">reader completion / process lifecycle</text>

    <path d="M302 245h64" stroke="#667085" stroke-width="2.4" marker-end="url(#arrow)"/>
    <path d="M688 245h64" stroke="#667085" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="314" y="227" fill="#667085" font-size="13">route</text>
    <text x="704" y="227" fill="#667085" font-size="13">drained</text>

    <rect x="66" y="384" width="506" height="204" rx="24" fill="#fff" stroke="#d0d5dd" stroke-width="2"/>
    <text x="96" y="424" fill="#667085" font-size="14">TRANSCRIPT MIRROR · BOUNDED RETRY</text>
    <rect x="96" y="452" width="132" height="52" rx="14" fill="#f2f4f7"/>
    <text x="162" y="484" fill="#344054" font-size="14" text-anchor="middle">message UUID</text>
    <path d="M228 478h54" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="292" y="452" width="112" height="52" rx="14" fill="#f1efff"/>
    <text x="348" y="474" fill="#6554c0" font-size="13" text-anchor="middle">dedupe</text>
    <text x="348" y="492" fill="#6554c0" font-size="13" text-anchor="middle">mark</text>
    <path d="M404 478h42" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="456" y="452" width="86" height="52" rx="14" fill="#edf8f3"/>
    <text x="499" y="484" fill="#287a5e" font-size="14" text-anchor="middle">save</text>
    <text x="96" y="542" fill="#475467" font-size="15">普通异常有限重试；超时不重试，避免并发重复。</text>
    <text x="96" y="568" fill="#475467" font-size="15">恢复副本仍可能缺口或迟到，不是执行真相。</text>

    <rect x="628" y="384" width="504" height="204" rx="24" fill="#fff7ed" stroke="#e1a568" stroke-width="2"/>
    <text x="658" y="424" fill="#a55415" font-size="14">EVIDENCE BOUNDARY</text>
    <text x="658" y="466" fill="#101828" font-size="21" font-weight="650">Ledger and mirror are mitigations</text>
    <text x="658" y="504" fill="#475467" font-size="16">它们降低过早关闭与恢复困难的概率，</text>
    <text x="658" y="536" fill="#475467" font-size="16">不证明私有 CLI 内部的调度语义。</text>
    <rect x="658" y="552" width="326" height="28" rx="9" fill="#fff"/>
    <text x="674" y="572" fill="#a55415" font-size="13">mitigation ≠ authoritative run boundary</text>

    <text x="66" y="640" fill="#475467" font-size="16">结论：观察 Result、台账耗尽、stdin/reader 与进程状态；不要把单个 Result 当作全局完成证明。</text>
  </g>
</svg>

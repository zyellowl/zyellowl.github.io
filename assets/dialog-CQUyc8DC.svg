<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img"><title>流程换版，对话如何继续</title><desc>用对话版本控制区分已有会话与新会话。横轴表示交互先后。</desc><defs>

}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    }
    #biechi-hi-fi * { box-sizing: border-box; }
    #biechi-hi-fi button { font: inherit; }
    #biechi-hi-fi .bc-phone {
      width: min(390px, calc(100vw - 20px));
      height: 770px;
      position: relative;
      overflow: hidden;
      border: 6px solid var(--bc-black);
      border-radius: 40px;
      background: var(--bc-cream);
      box-shadow: 0 24px 0 rgba(21,21,21,.12), 0 40px 80px rgba(21,21,21,.22);
    }
    #biechi-hi-fi .bc-status {
      height: 34px;
      padding: 10px 20px 0;
      position: absolute;
      inset: 0 0 auto;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 500;
    }
    #biechi-hi-fi .bc-screen {
      display: none;
      height: 100%;
      overflow-y: auto;
      padding: 45px 18px 28px;
      scrollbar-width: none;
    }
    #biechi-hi-fi .bc-screen::-webkit-scrollbar { display: none; }
    #biechi-hi-fi .bc-screen.active { display: block; animation: bc-enter .28s cubic-bezier(.2,.8,.25,1) both; }
    @keyframes bc-enter { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes bc-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @keyframes bc-jitter { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
    @keyframes bc-glitch { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-2px,1px); } 40% { transform: translate(2px,-1px); } 60% { transform: translate(-1px,-1px); } 80% { transform: translate(1px,1px); } }

    #biechi-hi-fi .bc-home { background: var(--bc-yellow); }
    #biechi-hi-fi .bc-header { display: flex; align-items: center; justify-content: space-between; }
    #biechi-hi-fi .bc-logo {
      padding: 7px 11px;
      border: 3px solid var(--bc-black);
      border-radius: 10px;
      background: var(--bc-cream);
      box-shadow: 4px 4px 0 var(--bc-black);
      transform: rotate(-3deg);
      font-size: 17px;
      font-weight: 500;
    }
    #biechi-hi-fi .bc-time-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 2px solid var(--bc-black);
      border-radius: 999px;
      background: var(--bc-red);
      color: var(--bc-cream);
      font-size: 11px;
      font-weight: 500;
    }
    #biechi-hi-fi .bc-home h1 { margin: 38px 0 8px; font-size: 38px; line-height: 1.06; letter-spacing: -2px; font-weight: 500; }
    #biechi-hi-fi .bc-home h1 span { display: inline-block; color: var(--bc-red); text-decoration: underline; text-decoration-thickness: 6px; text-underline-offset: 5px; transform: rotate(-2deg); }
    #biechi-hi-fi .bc-lead { margin: 0; max-width: 310px; font-size: 14px; line-height: 1.55; }
    #biechi-hi-fi .bc-food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 27px; }
    #biechi-hi-fi .bc-food-choice {
      min-height: 126px;
      position: relative;
      padding: 13px;
      overflow: hidden;
      border: 3px solid var(--bc-black);
      border-radius: 19px;
      background: var(--bc-cream);
      color: var(--bc-black);
      box-shadow: 4px 4px 0 var(--bc-black);
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }
    #biechi-hi-fi .bc-food-choice:nth-child(2) { transform: rotate(1.5deg); }
    #biechi-hi-fi .bc-food-choice:nth-child(3) { transform: rotate(-1.2deg); }
    #biechi-hi-fi .bc-food-choice[aria-pressed=&quot;true&quot;] { background: var(--bc-pink); transform: translateY(-5px) rotate(-1deg); }
    #biechi-hi-fi .bc-food-emoji { display: block; margin-bottom: 14px; font-family: Apple Color Emoji, Segoe UI Emoji, sans-serif; font-size: 38px; filter: drop-shadow(2px 3px 0 rgba(21,21,21,.16)); }
    #biechi-hi-fi .bc-food-choice strong { display: block; font-size: 15px; font-weight: 500; }
    #biechi-hi-fi .bc-food-choice small { display: block; margin-top: 3px; color: #645f56; font-size: 11px; }
    #biechi-hi-fi .bc-check {
      width: 23px;
      height: 23px;
      position: absolute;
      right: 10px;
      top: 10px;
      display: grid;
      place-items: center;
      border: 2px solid var(--bc-black);
      border-radius: 50%;
      background: var(--bc-cream);
      font-size: 12px;
    }
    #biechi-hi-fi .bc-action {
      width: 100%;
      min-height: 54px;
      margin-top: 21px;
      padding: 13px 16px;
      border: 3px solid var(--bc-black);
      border-radius: 15px;
      background: var(--bc-black);
      color: var(--bc-cream);
      box-shadow: 5px 5px 0 var(--bc-red);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    #biechi-hi-fi .bc-action:active { transform: translate(4px,4px); box-shadow: 1px 1px 0 var(--bc-red); }
    #biechi-hi-fi .bc-action.bc-light { background: var(--bc-yellow); color: var(--bc-black); box-shadow: 5px 5px 0 var(--bc-black); }
    #biechi-hi-fi .bc-action.bc-white { background: var(--bc-cream); color: var(--bc-black); box-shadow: 5px 5px 0 var(--bc-black); }
    #biechi-hi-fi .bc-text-action { width: 100%; min-height: 44px; padding: 11px; border: 0; background: transparent; color: inherit; text-decoration: underline; font-size: 12px; cursor: pointer; }

    #biechi-hi-fi .bc-analysis { padding-left: 0; padding-right: 0; background: var(--bc-black); color: var(--bc-cream); }
    #biechi-hi-fi .bc-analysis .bc-topline, #biechi-hi-fi .bc-consequence .bc-topline, #biechi-hi-fi .bc-lock .bc-topline { padding: 0 18px; }
    #biechi-hi-fi .bc-topline { display: flex; align-items: center; justify-content: space-between; }
    #biechi-hi-fi .bc-back { min-height: 42px; padding: 8px 0; border: 0; background: transparent; color: inherit; font-size: 12px; cursor: pointer; }
    #biechi-hi-fi .bc-level { padding: 6px 9px; border: 2px solid currentColor; border-radius: 999px; font-size: 11px; }
    #biechi-hi-fi .bc-photo-stage { height: 330px; position: relative; margin-top: 7px; overflow: hidden; background: #34362f; }
    #biechi-hi-fi .bc-food-photo { position: absolute; inset: 0; background-image: var(--bc-food-grid); background-size: 200% 200%; background-position: 0% 0%; filter: grayscale(.5) saturate(.52) hue-rotate(30deg) contrast(1.12); transform: scale(1.035); transition: filter .3s ease, transform .3s ease; }
    #biechi-hi-fi .bc-food-photo.more-ugly { filter: grayscale(.82) sepia(.25) saturate(.38) hue-rotate(55deg) contrast(1.28) brightness(.72); transform: scale(1.08); animation: bc-glitch .28s linear 2; }
    #biechi-hi-fi .bc-photo-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 35%, rgba(0,0,0,.88) 100%); }
    #biechi-hi-fi .bc-photo-noise { position: absolute; inset: 0; opacity: .18; background-image: repeating-radial-gradient(circle at 17% 23%, transparent 0 4px, rgba(186,242,109,.7) 5px 6px, transparent 7px 18px); mix-blend-mode: color; }
    #biechi-hi-fi .bc-photo-copy { position: absolute; inset: auto 18px 17px; z-index: 3; }
    #biechi-hi-fi .bc-photo-copy b { display: inline-block; margin-bottom: 8px; padding: 5px 8px; background: var(--bc-green); color: var(--bc-black); transform: rotate(-2deg); font-size: 11px; font-weight: 500; }
    #biechi-hi-fi .bc-photo-copy h2 { margin: 0; font-size: 28px; line-height: 1.08; letter-spacing: -1px; font-weight: 500; }
    #biechi-hi-fi .bc-ugly-control { position: absolute; z-index: 4; right: 13px; top: 14px; min-height: 42px; padding: 8px 10px; border: 2px solid var(--bc-cream); border-radius: 999px; background: rgba(21,21,21,.8); color: var(--bc-cream); font-size: 11px; cursor: pointer; }
    #biechi-hi-fi .bc-analysis-body { padding: 17px 18px 26px; }
    #biechi-hi-fi .bc-file-row { display: grid; grid-template-columns: 42px 1fr; gap: 11px; margin-bottom: 10px; padding: 12px; border: 2px solid rgba(255,255,255,.82); border-radius: 14px; background: #292929; }
    #biechi-hi-fi .bc-file-row:nth-child(2) { transform: rotate(.5deg); }
    #biechi-hi-fi .bc-file-icon { display: grid; place-items: center; height: 42px; border-radius: 11px; background: var(--bc-yellow); color: var(--bc-black); font-family: Apple Color Emoji, Segoe UI Emoji, sans-serif; font-size: 22px; }
    #biechi-hi-fi .bc-file-row strong { display: block; font-size: 13px; font-weight: 500; }
    #biechi-hi-fi .bc-file-row p { margin: 4px 0 0; color: #d2d2d2; font-size: 11px; line-height: 1.48; }

    #biechi-hi-fi .bc-consequence { background: var(--bc-red); color: var(--bc-cream); }
    #biechi-hi-fi .bc-consequence h2 { margin: 24px 0 4px; color: var(--bc-yellow); font-size: 32px; line-height: 1.05; font-weight: 500; text-shadow: 3px 3px 0 var(--bc-black); }
    #biechi-hi-fi .bc-consequence-lead { margin: 10px 0 18px; font-size: 13px; line-height: 1.5; }
    #biechi-hi-fi .bc-number-panel { padding: 17px; border: 3px solid var(--bc-black); border-radius: 18px; background: var(--bc-cream); color: var(--bc-black); box-shadow: 6px 6px 0 var(--bc-black); transform: rotate(-.7deg); }
    #biechi-hi-fi .bc-number-label { font-size: 11px; }
    #biechi-hi-fi .bc-number-main { margin: 4px 0 1px; font-size: 45px; line-height: 1; letter-spacing: -2px; font-weight: 500; }
    #biechi-hi-fi .bc-number-main span { font-size: 15px; letter-spacing: 0; }
    #biechi-hi-fi .bc-number-sub { color: #655f55; font-size: 11px; line-height: 1.45; }
    #biechi-hi-fi .bc-fat-line { margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--bc-black); font-size: 12px; line-height: 1.45; }
    #biechi-hi-fi .bc-fat-line b { color: var(--bc-red); font-size: 19px; font-weight: 500; }
    #biechi-hi-fi .bc-chat-title { margin: 21px 0 10px; font-size: 14px; font-weight: 500; }
    #biechi-hi-fi .bc-chat { display: grid; gap: 9px; }
    #biechi-hi-fi .bc-bubble { max-width: 84%; padding: 11px 13px; border: 3px solid var(--bc-black); border-radius: 16px 16px 16px 4px; background: var(--bc-cream); color: var(--bc-black); box-shadow: 3px 3px 0 var(--bc-black); font-size: 12px; line-height: 1.45; }
    #biechi-hi-fi .bc-bubble.right { justify-self: end; border-radius: 16px 16px 4px 16px; background: var(--bc-blue); }
    #biechi-hi-fi .bc-consequence .bc-action { margin-top: 20px; }

    #biechi-hi-fi .bc-lock { background: var(--bc-yellow); }
    #biechi-hi-fi .bc-lock h2 { margin: 29px 0 7px; font-size: 31px; line-height: 1.08; font-weight: 500; }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;biechi-hi-fi&#x27;);
      const screens = [...root.querySelectorAll(&#x27;.bc-screen&#x27;)];
      const choices = [...root.querySelectorAll(&#x27;.bc-food-choice&#x27;)];
      const steps = [...root.querySelectorAll(&#x27;.bc-lock-step&#x27;)];
      const photo = root.querySelector(&#x27;#bc-food-photo&#x27;);
      const uglyControl = root.querySelector(&#x27;#bc-ugly-control&#x27;);
      const progress = root.querySelector(&#x27;.bc-progress&#x27;);
      const progressFill = root.querySelector(&#x27;#bc-progress-fill&#x27;);
      const progressCopy = root.querySelector(&#x27;#bc-progress-copy&#x27;);
      const finish = root.querySelector(&#x27;#bc-finish&#x27;);
      const toast = root.querySelector(&#x27;#bc-toast&#x27;);
      const profiles = {
        malatang: { name: &#x27;麻辣烫&#x27;, emoji: &#x27;🍜&#x27;, kcal: 900, fat: 117, position: &#x27;0% 0%&#x27;, hygiene: &#x27;深夜营业不代表食材一定不新鲜，但你无法从菜单照片判断储存、清洁和用油情况。&#x27; },
        noodles: { name: &#x27;泡面&#x27;, emoji: &#x27;🍜&#x27;, kcal: 550, fat: 71, position: &#x27;100% 0%&#x27;, hygiene: &#x27;泡面本身不是脏，但隔夜配菜、操作台清洁和汤底保存情况，你无法从菜单照片判断。&#x27; },
        chicken: { name: &#x27;炸鸡&#x27;, emoji: &#x27;🍗&#x27;, kcal: 820, fat: 106, position: &#x27;0% 100%&#x27;, hygiene: &#x27;深夜炸物的用油频次、存放时间和复热情况，你无法从漂亮的菜单照片里看到。&#x27; },
        bbq: { name: &#x27;烧烤&#x27;, emoji: &#x27;🍢&#x27;, kcal: 760, fat: 98, position: &#x27;100% 100%&#x27;, hygiene: &#x27;串好的食材放了多久、是否充分冷藏、操作台是否清洁，都不是外卖照片能证明的。&#x27; }
      };
      let selected = &#x27;malatang&#x27;;

      function clockContext() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, &#x27;0&#x27;);
        const mm = String(now.getMinutes()).padStart(2, &#x27;0&#x27;);
        const time = `${hh}:${mm}`;
        const hour = now.getHours();
        const bucket = hour &gt;= 0 &amp;&amp; hour &lt; 5 ? &#x27;凌晨警报&#x27; : hour &gt;= 22 ? &#x27;深夜警报&#x27; : hour &gt;= 20 ? &#x27;夜间警报&#x27; : &#x27;夜宵警报&#x27;;
        root.querySelector(&#x27;#bc-status-time&#x27;).textContent = time;
        root.querySelector(&#x27;#bc-time-pill&#x27;).textContent = `${time} · ${bucket}`;
        root.querySelector(&#x27;#bc-photo-time&#x27;).textContent = `${time} 的实物滤镜`;
        root.querySelector(&#x27;#bc-consequence-time&#x27;).textContent = time;
      }

      function showScreen(name) {
        screens.forEach((screen) =&gt; screen.classList.toggle(&#x27;active&#x27;, screen.dataset.screen === name));
        root.querySelector(&#x27;.bc-phone&#x27;).scrollTop = 0;
      }

      function applyProfile() {
        const profile = profiles[selected];
        photo.style.backgroundPosition = profile.position;
        photo.setAttribute(&#x27;aria-label&#x27;, `经过灰绿色丑化处理的${profile.name}外卖图片`);
        root.querySelector(&#x27;#bc-analysis-name&#x27;).textContent = profile.name;
        root.querySelector(&#x27;#bc-stop-food&#x27;)?.replaceChildren(profile.name);
        root.querySelector(&#x27;#bc-hygiene-copy&#x27;).textContent = profile.hygiene;
        root.querySelector(&#x27;#bc-consequence-name&#x27;).textContent = profile.name;
        root.querySelector(&#x27;#bc-kcal-main&#x27;).textContent = profile.kcal;
        root.querySelector(&#x27;#bc-fat-main&#x27;).textContent = `${profile.fat} 克`;
        root.querySelector(&#x27;#bc-chat-food&#x27;).textContent = profile.name;
        root.querySelector(&#x27;#bc-win-food&#x27;).textContent = profile.emoji;
        photo.classList.remove(&#x27;more-ugly&#x27;);
        uglyControl.textContent = &#x27;再丑一点 🤢&#x27;;
      }

      choices.forEach((choice) =&gt; choice.addEventListener(&#x27;click&#x27;, () =&gt; {
        selected = choice.dataset.food;
        choices.forEach((item) =&gt; {
          const active = item === choice;
          item.setAttribute(&#x27;aria-pressed&#x27;, String(active));
          item.querySelector(&#x27;.bc-check&#x27;).textContent = active ? &#x27;✓&#x27; : &#x27;&#x27;;
        });
      }));

      root.querySelectorAll(&#x27;[data-go]&#x27;).forEach((control) =&gt; control.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (control.dataset.go === &#x27;analysis&#x27;) applyProfile();
        showScreen(control.dataset.go);
      }));

      uglyControl.addEventListener(&#x27;click&#x27;, () =&gt; {
        const active = photo.classList.toggle(&#x27;more-ugly&#x27;);
        uglyControl.textContent = active ? &#x27;已经够丑了 ✓&#x27; : &#x27;再丑一点 🤢&#x27;;
      });

      steps.forEach((step) =&gt; step.addEventListener(&#x27;click&#x27;, () =&gt; {
        step.classList.toggle(&#x27;done&#x27;);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,

      .then(({ x, y }) =&gt; {

        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }

    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }

  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

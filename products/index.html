<h1>工作之外</h1><p class="lede">这些不是岗位项目，是自己和家里在用的东西。</p><h2>ChatOne</h2><p class="quiet">WEB</p><p>围绕自己的 AI 使用习惯打磨一个对话工作台。基于 LibreChat 二次开发，持续改模型接入、对话体验和日常部署。</p><h2>VibeShelf</h2><p class="quiet">macOS</p><p>把散落在本机的项目收进一个工作台，能看项目、Git 状态、服务启停和日志。</p><h2>存钱罐</h2><p class="quiet">iOS 与 Web</p><p>给家庭储蓄做看得见的反馈，把收支记录和历史趋势接在一起，同时打磨 Web 和 iOS。</p><h2>相遇万物</h2><p class="quiet">iOS 与 Web</p><p>和孩子记录在自然里的相遇。照片、心情和孩子的一句话放进一本成长相簿。</p></main>

<p class="where">京东集团</p><h1>京东金融首页 Feed</h1><p class="lede">内容规模扩大到原来的 20 倍，服务要同时守住内存、吞吐和尾延时。</p><p>参与推荐服务全链路优化，重构有效池，并处理缓存同步里的问题。</p><figure><img src="/assets/feed-BFUNXK0F.svg" alt="有效池内存变化与单机压测结果。"><figcaption>有效池内存变化与单机压测结果。</figcaption></figure><h2>有效池与缓存</h2><p>重构有效池，内存占用下降 75%。同步过程中的 Redis BigKey 也一并处理，让更大的内容池还能稳住。</p><h2>容量</h2><p>8 核 16 GB 单机压测到 5000 QPS。TP99 从 15ms 降到 10ms 以下。</p><p class="pager"><a href="/work/case-04">上一则 京东领航者</a><a href="/work/case-06">下一则 京东金融智能问答</a></p></main>
